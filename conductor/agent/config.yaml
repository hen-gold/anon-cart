jira:
  epic_key: DOM2-6162
  project_key: DOM2
  base_url: https://wix.atlassian.net
  epic_url: https://wix.atlassian.net/browse/DOM2-6162
  read_only: true

slack:
  channel_id: C0A6AMMMTFY
  channel_url: https://wix.slack.com/archives/C0A6AMMMTFY
  workspace: wix.slack.com
  read_only: true
  # Daily digest DM recipient
  digest_recipient_email: "hengo@wix.com"  # Set your Slack email here to receive daily digest DMs
  digest_recipient_user_id: "U06LKHPJG3W"  # Your Slack user ID (found via MCP-S Slack tools)

google_docs:
  master_document_id: 1WaJH6C4jCMAqGaF-UoUGPFtkieWxfASaTZBMRUfi0mM
  master_document_url: https://docs.google.com/document/d/1WaJH6C4jCMAqGaF-UoUGPFtkieWxfASaTZBMRUfi0mM/edit
  dependencies_sheet_id: 1DugSrwbNke5ExpA201Tp_IdQeb715DxKrf2gR8ltmSc
  dependencies_sheet_url: https://docs.google.com/spreadsheets/d/1DugSrwbNke5ExpA201Tp_IdQeb715DxKrf2gR8ltmSc/edit
  read_only: true

reporting:
  daily_digest_time: "18:00"  # 6 PM daily
  changelog_file: conductor/CHANGELOG.md
  reports_dir: conductor/reports
  digest_retention_days: 30  # Keep daily digests for 30 days
  send_slack_dm: true  # Send daily digest via Slack DM

sync:
  enabled_triggers:
    - code_commits
    - jira_updates
    - doc_changes
    - scheduled
  
  check_intervals:
    code_commits: 3600  # Check every hour
    jira_updates: 1800  # Check every 30 minutes
    doc_changes: 3600   # Check every hour
    scheduled: 86400     # Daily check
  
  context_files:
    bed_summary: conductor/sources/bed/premium-cart-summary.md
    fed_summary: conductor/sources/fed/premium-cart-anonymous-summary.md
    tech_stack: conductor/tech-stack.md
    tracks: conductor/tracks.md
    child_issues: conductor/sources/jira/child-issues.md
    master_doc: conductor/sources/docs/master-document.md
    dependencies: conductor/sources/docs/dependencies.md
    product: conductor/product.md
    decisions: conductor/decisions.md

logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  log_file: conductor/agent/logs/sync-agent.log
  max_log_size_mb: 10
  backup_count: 5
