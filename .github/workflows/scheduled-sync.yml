# Scheduled full sync: run Conductor agent (all sources + daily digest) at 9, 12, 15, 20 UTC Sun–Thu.
# Also runnable manually via workflow_dispatch.
name: Conductor – Scheduled sync

on:
  schedule:
    - cron: '0 9,12,15,20 * * 0-4'
  workflow_dispatch:

concurrency:
  group: conductor-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: conductor/agent/requirements.txt

      - name: Install dependencies
        run: pip install -r conductor/agent/requirements.txt

      - name: Setup Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" | base64 -d > "$RUNNER_TEMP/sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          fi

      - name: Run scheduled sync
        env:
          CONDUCTOR_PROJECT_ROOT: ${{ github.workspace }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python conductor/agent/sync-agent.py --mode scheduled

      - name: Commit and push conductor changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conductor/
          if git diff --staged --quiet; then
            echo "No conductor changes to commit"
          else
            git commit -m "chore(conductor): sync from sources [scheduled]"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin HEAD
          fi
