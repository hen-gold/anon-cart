# On-demand Conductor sync: triggered by repository_dispatch (e.g. Jira webhook → n8n → API)
# or manually via workflow_dispatch. event_type / input mode: jira-update, full-sync, digest.
name: Conductor – Dispatch

on:
  repository_dispatch:
    types: [jira-update, full-sync, digest]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: true
        default: 'jira-update'
        type: choice
        options:
          - jira-update
          - full-sync
          - digest

concurrency:
  group: conductor-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: conductor/agent/requirements.txt

      - name: Install dependencies
        run: pip install -r conductor/agent/requirements.txt

      - name: Setup Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" | base64 -d > "$RUNNER_TEMP/sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          fi

      - name: Resolve agent mode
        id: mode
        run: |
          EVENT_TYPE="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || github.event.action }}"
          case "$EVENT_TYPE" in
            jira-update) echo "agent_mode=jira" >> "$GITHUB_OUTPUT" ;;
            full-sync)   echo "agent_mode=full" >> "$GITHUB_OUTPUT" ;;
            digest)      echo "agent_mode=digest" >> "$GITHUB_OUTPUT" ;;
            *)           echo "agent_mode=jira" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run Conductor sync
        env:
          CONDUCTOR_PROJECT_ROOT: ${{ github.workspace }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python conductor/agent/sync-agent.py --mode ${{ steps.mode.outputs.agent_mode }}

      - name: Commit and push conductor changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_MODE: ${{ steps.mode.outputs.agent_mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conductor/
          if git diff --staged --quiet; then
            echo "No conductor changes to commit"
          else
            git commit -m "chore(conductor): sync from sources [$AGENT_MODE]"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin HEAD
          fi
